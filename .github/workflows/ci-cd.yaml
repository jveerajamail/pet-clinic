name: Java CI/CD Pipeline with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
env:
  DOCKER_IMAGE_NAME: pet-clinic

jobs:
  build-and-test:
    runs-on: linux-runner

    steps:
      # Step 1: Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Java Development Kit (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # Popular open-source OpenJDK distribution
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        run: ./gradlew build
      # Generate a unique tag based on the commit SHA
      - name: Prepare Image Tag
        id: prep
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
