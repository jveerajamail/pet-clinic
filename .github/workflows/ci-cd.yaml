name: Java CI/CD Pipeline with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
env:
  DOCKER_IMAGE_NAME: pet-clinic

jobs:
  build-and-test:
    runs-on: linux-runner

    steps:
      # Step 1: Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up the Java Development Kit (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # Popular open-source OpenJDK distribution
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        run: ./gradlew build
      # Generate a unique tag based on the commit SHA
      - name: Prepare Image Tag
        id: prep
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max  
      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_DATA }}
      - name: Deploy to Kubernetes Cluster
        run: |
          # 1. Apply the Secret, Service, and Deployment for PostgreSQL
          kubectl apply -f k8s/db.yml

          # 2. Dynamic tracking: Wait for Postgres to accept traffic via its readiness probe
          echo "Waiting for demo-db database pods to be healthy..."
          kubectl wait --namespace=default \
            --for=condition=ready pod \
            --selector=app=demo-db \
            --timeout=120s

          # 3. Swap the default template image text with your freshly built Docker image
          sed -i 's|image: dsyer/petclinic|image: '"${{ secrets.DOCKERHUB_USERNAME }}/pet-clinic:${{ github.sha }}"'|g' k8s/petclinic.yml

          # 4. Deploy your app manifests safely now that the DB backend is live
          kubectl apply -f k8s/petclinic.yml

          # 5. Block the pipeline runner until Spring Boot passes its /readyz health checking
          kubectl rollout status deployment/petclinic --timeout=180s
